[client]
# 公网统一入口，REST 与 WebSocket 通过 path 复用同一端口
server   = http://192.168.31.28:5273

# 设备鉴权 Token（在设备管理页面添加设备或查看 Token 后粘贴到这里）
token    = YOUR_DEVICE_TOKEN_HERE

# 遥测上报间隔（秒），建议 30~300
interval = 60

# 当前巡检点 ID（留 0 表示不关联巡检点）
point_id = 0

# 当前巡检路线 ID（留 0 表示不关联路线）
route_id = 0

# GPS 读取超时（秒）
gps_timeout = 5

# GPS 串口设备（当前 ROS1 车端 Wheeltec GPS/RTK 标准 udev 名称）
gps_serial_device = /dev/wheeltec_gnss

# GPS 串口波特率
gps_serial_baud = 38400

# GPS 连续失败时，每隔多少轮重复打印一次告警
gps_log_every = 10

# 是否启用网络定位 fallback（1=启用，0=关闭）
network_locate_enabled = 0

# 网络定位 provider，目前支持 google
network_provider = google

# Google Geolocation API Key
network_api_key =

# 网络定位 API URL
network_api_url = https://www.googleapis.com/geolocation/v1/geolocate

# 网络定位请求超时（秒）
network_timeout = 10

# 用于扫描 Wi-Fi 的网卡
network_interface = wlan0

# 没扫到 Wi-Fi 时，是否允许退回到 IP 粗定位
network_consider_ip = 1
